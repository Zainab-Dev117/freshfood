<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks — FreshFind</title>
    <meta name="description" content="View your saved farmers markets and fresh produce items with personal session notes and direct client-side export.">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/freshfind-premium.css">
</head>

<body>

    <!-- Global Header with Live Clock & Navigation (Requirements 2 & 40) -->
    <header id="freshfindGlobalHeader"></header>

    <!-- Breadcrumb (Requirement 31) -->
    <div class="breadcrumb-container-fresh">
        <div class="container">
            <ul class="breadcrumb-fresh">
                <li><a href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                <li class="separator">/</li>
                <li class="active">Bookmarks</li>
            </ul>
        </div>
    </div>

    <!-- Bookmarks Page Header & Export System (Requirements 31 & 33) -->
    <section class="py-5 bg-white border-bottom">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <span class="badge-pill-fresh mb-2 d-inline-block">SAVED RECOMMENDATIONS</span>
                    <h1 class="font-playfair text-fresh mb-2 display-6 fw-bold">
                        My Bookmarks <span class="badge bg-danger rounded-pill fs-6 align-middle ms-2" id="totalBookmarksCountBadge">0</span>
                    </h1>
                    <p class="text-muted lead fs-6 mb-0">
                        Review your saved favorite markets, produce items, and personal visit notes.
                    </p>
                </div>

                <!-- Export Controls (Requirement 33: Client-side download without server) -->
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-fresh" id="btnExportBookmarksTxt">
                        <i class="fa-solid fa-file-arrow-down me-1"></i> Export Bookmarks (.TXT)
                    </button>
                    <button type="button" class="btn btn-outline-fresh" id="btnExportBookmarksJson" title="Export as JSON">
                        <i class="fa-solid fa-code me-1"></i> JSON
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Bookmarks Content (Requirements 31 & 32) -->
    <section class="py-5 bg-light">
        <div class="container">
            <!-- Saved Markets Section (Requirement 31) -->
            <div class="mb-5">
                <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                    <h3 class="font-playfair text-fresh mb-0">
                        <i class="fa-solid fa-store me-2 text-fresh"></i> Saved Markets
                        <span class="badge bg-secondary-subtle text-secondary rounded-pill fs-6 ms-2" id="savedMarketsCountBadge">0</span>
                    </h3>
                    <a href="market.html" class="text-fresh small fw-semibold text-decoration-none">
                        + Find more markets
                    </a>
                </div>

                <div class="row" id="savedMarketsContainer">
                    <!-- Saved market cards populated by bookmarks_page.js -->
                </div>
            </div>

            <!-- Saved Produce Section (Requirement 31) -->
            <div class="mb-4">
                <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                    <h3 class="font-playfair text-fresh mb-0">
                        <i class="fa-solid fa-apple-whole me-2 text-fresh"></i> Saved Produce
                        <span class="badge bg-secondary-subtle text-secondary rounded-pill fs-6 ms-2" id="savedProduceCountBadge">0</span>
                    </h3>
                    <a href="produce.html" class="text-fresh small fw-semibold text-decoration-none">
                        + Explore produce guide
                    </a>
                </div>

                <div class="row" id="savedProduceContainer">
                    <!-- Saved produce cards populated by bookmarks_page.js -->
                </div>
            </div>
        </div>
    </section>

    <!-- Global Footer (Requirement 46) -->
    <div id="freshfindGlobalFooter"></div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FreshFind Core Architecture Scripts (Requirement 50) -->
    <script src="js/engine.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/bookmarks_page.js"></script>
</body>

</html>
