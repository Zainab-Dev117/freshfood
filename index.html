<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>FreshFind | Local Markets</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-expand-lg fresh-navbar">

    <div class="container">

        <!-- Logo -->

        <a class="navbar-brand fresh-logo" href="index.html">

            <div class="logo-icon">
                <i class="fa-solid fa-basket-shopping"></i>

                <span class="leaf leaf-1"></span>
                <span class="leaf leaf-2"></span>
            </div>

            <div>
                <h4>FreshFind</h4>

                <small>
                    Fresh All Along 
                </small>
            </div>

        </a>


        <!-- Mobile Toggle -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar Menu -->

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="index.html"
                    >
                        <i class="fa-solid fa-house me-1"></i>
                        Home
                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link" href="#">
                        Markets
                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link" href="#">
                        Seasonal Picks
                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link" href="#">
                        About
                    </a>

                </li>

            </ul>


            <!-- Right Icons -->

            <div class="navbar-actions d-flex align-items-center gap-2">

                <button
                    class="nav-icon-btn"
                    type="button"
                    aria-label="Search"
                >
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>


                <button
                    class="profile-btn"
                    type="button"
                    aria-label="Profile"
                >
                    <i class="fa-regular fa-user"></i>
                </button>

            </div>

        </div>

    </div>

</nav>







<!-- footer start -->

<footer class="fresh-footer">

    <div class="container">

        <div class="footer-content">

            <!-- Footer Logo -->
            <div class="footer-logo">

                <a href="index.html">
                    <img src="images/footer.png" alt="FreshFind Logo">
                </a>
            
            </div>

            <!-- Footer Navigation -->
            <nav class="footer-nav">

                <a href="index.html">Home</a>
                <span class="footer-divider">|</span>

                <a href="#markets">Markets</a>
                <span class="footer-divider">|</span>

                <a href="#seasonal">Seasonal Picks</a>
                <span class="footer-divider">|</span>

                <a href="#about">About</a>
                <span class="footer-divider">|</span>

                <a href="#contact">Contact</a>

            </nav>

            <!-- Social Media -->
            <div class="footer-social">

                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#" aria-label="X">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>

            </div>

        </div>

    </div>

    <!-- Decorative Leaves -->
    <div class="footer-leaf-decoration">
        <span class="leaf leaf-one"></span>
        <span class="leaf leaf-two"></span>
        <span class="leaf leaf-three"></span>
    </div>

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
