<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FreshFind</title>
    <meta name="description" content="Sign in to your FreshFind account.">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/freshfind-premium.css">
</head>

<body>

    <!-- Global Header with Live Clock & Navigation (Requirements 2 & 40) -->
    <header id="freshfindGlobalHeader"></header>

    <!-- Login Container (Requirement 44) -->
    <section class="py-5" style="min-height: 75vh; display: flex; align-items: center;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-8">
                    <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4 bg-white">
                        <div class="text-center mb-4">
                            <span class="badge-pill-fresh mb-2 d-inline-block">WELCOME BACK</span>
                            <h2 class="font-playfair text-fresh mb-1">Login to FreshFind</h2>
                            <p class="text-muted small">Sign in to continue exploring local markets.</p>
                        </div>

                        <form id="standaloneLoginForm" onsubmit="event.preventDefault(); FreshFindUI.handleLoginSubmit();">
                            <div class="mb-3">
                                <label for="loginPageEmail" class="form-label-fresh">Email Address</label>
                                <input type="email" id="loginPageEmail" class="form-control form-control-fresh" placeholder="you@example.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="loginPagePassword" class="form-label-fresh">Password</label>
                                <input type="password" id="loginPagePassword" class="form-control form-control-fresh" placeholder="••••••••" required>
                            </div>

                            <button type="submit" class="btn btn-fresh btn-lg w-100 mb-3">
                                Login
                            </button>
                        </form>

                        <!-- Required Non-Functional Notice (Requirement 44) -->
                        <div class="alert alert-info border-0 d-flex align-items-center gap-2 mb-3" role="alert">
                            <i class="fa-solid fa-circle-info fs-5 flex-shrink-0"></i>
                            <small>Login/signup is not part of the current FreshFind implementation. All exploration features are fully unlocked.</small>
                        </div>

                        <div class="text-center">
                            <small class="text-muted">Don't have an account? <a href="signup.html" class="text-fresh fw-bold text-decoration-none">Sign Up</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Global Footer (Requirement 46) -->
    <div id="freshfindGlobalFooter"></div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FreshFind Core Architecture Scripts (Requirement 50) -->
    <script src="js/engine.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chatbot.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.FreshFindUI) {
                FreshFindUI.initGlobalUI();
                FreshFindUI.injectFooter();
            }
        });
    </script>
</body>

</html>
