<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmers Market Directory — FreshFind</title>
    <meta name="description" content="Complete directory of verified local farmers markets. Filter by area, operating day, distance, and seasonal produce.">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/freshfind-premium.css">
</head>

<body>

    <!-- Global Header with Live Clock & Navigation (Requirements 2 & 40) -->
    <header id="freshfindGlobalHeader"></header>

    <!-- Breadcrumb (Requirement 16) -->
    <div class="breadcrumb-container-fresh">
        <div class="container">
            <ul class="breadcrumb-fresh">
                <li><a href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                <li class="separator">/</li>
                <li class="active">Market Directory</li>
            </ul>
        </div>
    </div>

    <!-- Directory Hero Banner -->
    <section class="py-5 bg-white border-bottom">
        <div class="container">
            <div class="max-w-800">
                <span class="badge-pill-fresh mb-2 d-inline-block">COMPLETE LISTING</span>
                <h1 class="font-playfair text-fresh mb-2 display-6 fw-bold">Farmers Market Directory</h1>
                <p class="text-muted lead mb-0">
                    Explore neighborhood farmers markets across the city. Find real-time operating hours, schedules, distance-based directions, and fresh produce selections.
                </p>
            </div>
        </div>
    </section>

    <!-- Dedicated Discovery & Filter Controls (Requirements 11, 12, 13) -->
    <section class="py-4 bg-light border-bottom">
        <div class="container">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="row g-3 align-items-end">
                    <!-- Text Search (Requirement 11) -->
                    <div class="col-lg-3 col-md-6">
                        <label for="directorySearch" class="form-label-fresh">
                            <i class="fa-solid fa-magnifying-glass text-fresh"></i> Search
                        </label>
                        <input type="text" id="directorySearch" class="form-control form-control-fresh" placeholder="Name, area, produce...">
                    </div>

                    <!-- Area Filter (Requirement 11.1) -->
                    <div class="col-lg-2 col-md-6">
                        <label for="directoryArea" class="form-label-fresh">
                            <i class="fa-solid fa-location-dot text-fresh"></i> Area
                        </label>
                        <select id="directoryArea" class="form-select form-select-fresh">
                            <option value="">All Areas</option>
                        </select>
                    </div>

                    <!-- Day Filter (Requirement 11.2) -->
                    <div class="col-lg-2 col-md-6">
                        <label for="directoryDay" class="form-label-fresh">
                            <i class="fa-regular fa-calendar text-fresh"></i> Day
                        </label>
                        <select id="directoryDay" class="form-select form-select-fresh">
                            <option value="">All Days</option>
                        </select>
                    </div>

                    <!-- Produce Filter (Requirement 11.3) -->
                    <div class="col-lg-2 col-md-6">
                        <label for="directoryProduce" class="form-label-fresh">
                            <i class="fa-solid fa-carrot text-fresh"></i> Produce
                        </label>
                        <select id="directoryProduce" class="form-select form-select-fresh">
                            <option value="">All Produce</option>
                        </select>
                    </div>

                    <!-- Market Sorting (Requirement 12) -->
                    <div class="col-lg-2 col-md-6">
                        <label for="directorySort" class="form-label-fresh">
                            <i class="fa-solid fa-arrow-down-wide-short text-fresh"></i> Sort By
                        </label>
                        <select id="directorySort" class="form-select form-select-fresh">
                            <option value="default">Default</option>
                            <option value="az">A-Z (Name)</option>
                            <option value="za">Z-A (Reverse)</option>
                            <option value="nearest">Nearest (GPS)</option>
                            <option value="next-open">Next Open</option>
                        </select>
                    </div>

                    <!-- Reset Button -->
                    <div class="col-lg-1 col-md-12">
                        <button type="button" class="btn btn-outline-secondary w-100" id="btnClearDirectoryFilters" title="Clear All Filters">
                            <i class="fa-solid fa-rotate-left"></i>
                        </button>
                    </div>
                </div>

                <!-- Geolocation & Meta Bar (Requirement 13 & 16) -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center pt-3 mt-3 border-top gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <!-- Geolocation Button (Requirement 13) -->
                        <button type="button" class="btn btn-outline-fresh btn-sm" id="btnUseMyLocation">
                            <i class="fa-solid fa-location-crosshairs me-1"></i> Use My Location
                        </button>
                        <small id="geoStatusMessage" class="text-muted"></small>
                    </div>

                    <!-- Result Count (Requirement 16) -->
                    <div class="text-muted small" id="directoryResultsCount">
                        Loading directory count...
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Market Cards Results Grid (Requirements 14 & 17) -->
    <section class="py-5">
        <div class="container">
            <div class="row" id="marketDirectoryCards">
                <!-- Market cards populated dynamically by market_directory.js -->
            </div>
        </div>
    </section>

    <!-- Global Footer (Requirement 46) -->
    <div id="freshfindGlobalFooter"></div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FreshFind Core Architecture Scripts (Requirement 50) -->
    <script src="js/engine.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/market_directory.js"></script>
</body>

</html>
