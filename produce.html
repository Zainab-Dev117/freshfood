<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Produce Guide — FreshFind</title>
    <meta name="description" content="Complete guide to seasonal fruits, vegetables, culinary herbs, and local dairy available across nearby farmers markets.">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/freshfind-premium.css">
</head>

<body>

    <!-- Global Header with Live Clock & Navigation (Requirements 2 & 40) -->
    <header id="freshfindGlobalHeader"></header>

    <!-- Breadcrumb (Requirement 24) -->
    <div class="breadcrumb-container-fresh">
        <div class="container">
            <ul class="breadcrumb-fresh">
                <li><a href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a></li>
                <li class="separator">/</li>
                <li class="active">Produce Guide</li>
            </ul>
        </div>
    </div>

    <!-- Produce Guide Hero -->
    <section class="py-5 bg-white border-bottom">
        <div class="container">
            <div class="max-w-800">
                <span class="badge-pill-fresh mb-2 d-inline-block">SEASONAL HARVEST CATALOGUE</span>
                <h1 class="font-playfair text-fresh mb-2 display-6 fw-bold">Fresh Produce Guide</h1>
                <p class="text-muted lead mb-0">
                    Discover wholesome fruits, vegetables, fresh herbs, and farm dairy. Learn about growing seasons, natural flavor profiles, and which markets carry them.
                </p>
            </div>
        </div>
    </section>

    <!-- Filter & Search Controls (Requirements 25 & 26, 29) -->
    <section class="py-4 bg-light border-bottom">
        <div class="container">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="row g-3 align-items-end">
                    <!-- Produce Search (Requirement 25) -->
                    <div class="col-lg-5 col-md-6">
                        <label for="searchProduceInput" class="form-label-fresh">
                            <i class="fa-solid fa-magnifying-glass text-fresh"></i> Search Produce
                        </label>
                        <input type="text" id="searchProduceInput" class="form-control form-control-fresh" placeholder="Search by name, description, season...">
                    </div>

                    <!-- Category Filter (Requirement 26) -->
                    <div class="col-lg-5 col-md-6">
                        <label for="produceCategoryFilter" class="form-label-fresh">
                            <i class="fa-solid fa-layer-group text-fresh"></i> Category
                        </label>
                        <select id="produceCategoryFilter" class="form-select form-select-fresh">
                            <option value="all">All Categories</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Herbs">Herbs</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Bakery">Bakery</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Reset Button -->
                    <div class="col-lg-2 col-md-12">
                        <button type="button" class="btn btn-outline-secondary w-100" id="btnClearProduceFilters">
                            <i class="fa-solid fa-rotate-left me-1"></i> Reset
                        </button>
                    </div>
                </div>

                <!-- Season Recommendations Pills (Requirement 29) -->
                <div class="pt-3 mt-3 border-top d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div class="d-flex align-items-center gap-2 flex-wrap" id="produceSeasonTabs">
                        <!-- Season tabs rendered dynamically by produce.js -->
                    </div>

                    <div class="text-muted small" id="produceResultsCount">
                        Loading catalogue count...
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Produce Grid Section (Requirement 27) -->
    <section class="py-5">
        <div class="container">
            <div class="row" id="produceGridContainer">
                <!-- Produce cards populated by produce.js -->
            </div>
        </div>
    </section>

    <!-- Global Footer (Requirement 46) -->
    <div id="freshfindGlobalFooter"></div>

    <!-- Bootstrap 5.3 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FreshFind Core Architecture Scripts (Requirement 50) -->
    <script src="js/engine.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/produce.js"></script>
</body>

</html>
